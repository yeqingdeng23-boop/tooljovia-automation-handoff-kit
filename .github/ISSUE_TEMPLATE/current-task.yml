name: Current ToolJovia task feedback
description: Share a specific tool task and a missing result.
title: "Current ToolJovia task feedback"
body:
  - type: markdown
    attributes:
      value: |
        This creates a **public GitHub Issue** and requires GitHub sign-in. Do not include client data, credentials, photos or confidential project details. Use neutral descriptions instead.

        For personal tools, describe controls or ordinary steps only; omit personal letters, beliefs, dreams and loss stories.

        The free kit download requires no account. Feedback is voluntary, and no paid service is currently offered.
  - type: textarea
    id: current-task
    attributes:
      label: What task are you working on now?
      description: Describe ordinary steps and the output you need, using neutral roles rather than names.
      placeholder: "I need to hand over a three-branch workflow to its operating owner."
    validations:
      required: true
  - type: textarea
    id: current-method
    attributes:
      label: What do you use for this task now? (optional)
      placeholder: "A document, spreadsheet, messages, or another method."
    validations:
      required: false
  - type: textarea
    id: missing-deliverable
    attributes:
      label: What deliverable is still missing?
      description: Name the file or result you still need to finish this task.
      placeholder: "A client-readable record linking each branch to its test evidence and remaining work."
    validations:
      required: true
  - type: dropdown
    id: extra-scope
    attributes:
      label: Would you want to discuss extra scope and price? (optional)
      description: No paid service is currently offered.
      options:
        - Free kit only
        - I would like to discuss extra scope and price
        - Not sure yet
    validations:
      required: false
