<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 728" role="img" aria-labelledby="title desc">
<title id="title">Illustrated timing example: shift three subtitles 1.5 seconds later</title>
<desc id="desc">Three fictional subtitle cues move by a known fixed offset of plus 1.5 seconds. Cue 1 moves from 1.0–2.5 to 2.5–4.0 seconds, cue 2 from 3.0–4.5 to 4.5–6.0 seconds, and cue 3 from 5.0–6.5 to 6.5–8.0 seconds. The duration of each cue remains 1.5 seconds. This illustration is not a screenshot, actual export, or user case.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17263d}.title{font-size:27px;font-weight:700}.sub{font-size:18px;fill:#41546b}.cue{font-size:19px;font-weight:700}.label{font-size:18px;font-weight:600}.time{font-size:17px;fill:#3d516c}.blue{fill:#1452bd}.tick{font-size:17px;fill:#41546b}.foot{font-size:17px;fill:#334b67}</style>
<rect width="480" height="728" rx="16" fill="#f4f7fb"/>
<text x="20" y="38" class="title">Shift subtitles 1.5 seconds later</text>
<text x="20" y="66" class="sub">Illustrated timing example · known fixed offset</text>
<text x="20" y="92" class="sub">Use when every cue is early by the same amount.</text>
<text x="24" y="129" class="tick">Seconds</text><line x1="158" y1="140" x2="464" y2="140" stroke="#64748b" stroke-width="2"/><line x1="158" y1="135" x2="158" y2="145" stroke="#64748b" stroke-width="2"/><text x="158" y="129" text-anchor="middle" class="tick">0</text><line x1="192" y1="135" x2="192" y2="145" stroke="#64748b" stroke-width="2"/><text x="192" y="129" text-anchor="middle" class="tick">1</text><line x1="226" y1="135" x2="226" y2="145" stroke="#64748b" stroke-width="2"/><text x="226" y="129" text-anchor="middle" class="tick">2</text><line x1="260" y1="135" x2="260" y2="145" stroke="#64748b" stroke-width="2"/><text x="260" y="129" text-anchor="middle" class="tick">3</text><line x1="294" y1="135" x2="294" y2="145" stroke="#64748b" stroke-width="2"/><text x="294" y="129" text-anchor="middle" class="tick">4</text><line x1="328" y1="135" x2="328" y2="145" stroke="#64748b" stroke-width="2"/><text x="328" y="129" text-anchor="middle" class="tick">5</text><line x1="362" y1="135" x2="362" y2="145" stroke="#64748b" stroke-width="2"/><text x="362" y="129" text-anchor="middle" class="tick">6</text><line x1="396" y1="135" x2="396" y2="145" stroke="#64748b" stroke-width="2"/><text x="396" y="129" text-anchor="middle" class="tick">7</text><line x1="430" y1="135" x2="430" y2="145" stroke="#64748b" stroke-width="2"/><text x="430" y="129" text-anchor="middle" class="tick">8</text><line x1="464" y1="135" x2="464" y2="145" stroke="#64748b" stroke-width="2"/><text x="464" y="129" text-anchor="middle" class="tick">9</text>
<g>
<rect x="12" y="159" width="456" height="150" rx="12" fill="#fff" stroke="#dbe5f1"/>
<text x="24" y="189" class="cue">1. Welcome to the demonstration.</text>
<text x="24" y="223" class="label">Before</text><text x="24" y="243" class="time">1.0–2.5 s</text>
<text x="24" y="271" class="label blue">After</text><text x="24" y="291" class="time blue">2.5–4.0 s</text>
<rect x="192" y="217" width="51" height="22" rx="5" fill="#657a94"/><rect x="243" y="265" width="51" height="22" rx="5" fill="#145bd7"/>
</g>
<g>
<rect x="12" y="325" width="456" height="150" rx="12" fill="#fff" stroke="#dbe5f1"/>
<text x="24" y="355" class="cue">2. Set a fixed offset.</text>
<text x="24" y="389" class="label">Before</text><text x="24" y="409" class="time">3.0–4.5 s</text>
<text x="24" y="437" class="label blue">After</text><text x="24" y="457" class="time blue">4.5–6.0 s</text>
<rect x="260" y="383" width="51" height="22" rx="5" fill="#657a94"/><rect x="311" y="431" width="51" height="22" rx="5" fill="#145bd7"/>
</g>
<g>
<rect x="12" y="491" width="456" height="150" rx="12" fill="#fff" stroke="#dbe5f1"/>
<text x="24" y="521" class="cue">3. Check the exported file.</text>
<text x="24" y="555" class="label">Before</text><text x="24" y="575" class="time">5.0–6.5 s</text>
<text x="24" y="603" class="label blue">After</text><text x="24" y="623" class="time blue">6.5–8.0 s</text>
<rect x="328" y="549" width="51" height="22" rx="5" fill="#657a94"/><rect x="379" y="597" width="51" height="22" rx="5" fill="#145bd7"/>
</g>

<text x="20" y="681" class="foot">Each cue keeps its 1.5-second duration and text.</text>
<text x="20" y="706" class="foot">Fictional illustration; not a screenshot or actual export.</text>
</svg>
